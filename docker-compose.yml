services:
  # --- BACKEND (Node.js / Express — CapBudget) ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: capbudget_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
      NODE_ENV: development
      # DATABASE_URL, JWT_SECRET, EMAIL_USER, EMAIL_PASS → chargés depuis backend/.env (Neon PostgreSQL)

  # --- FRONTEND (React / Vite — CapBudget) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: capbudget_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000
    depends_on:
      - backend
